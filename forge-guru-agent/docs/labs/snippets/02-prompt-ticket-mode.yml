# Lab 2 snippet. Paste this into the `prompt:` block of `rovo:agent` in
# `manifest.yml`, immediately AFTER the `## Ideation mode` section (added in
# Lab 1) and BEFORE the `## Important` section.
#
# Preserve the leading indentation of the surrounding prompt lines. In the
# starter manifest the prompt body is indented 8 spaces under `prompt: >`.
# If the existing lines show 8 leading spaces, these new lines must too.

        ## File an idea as a Jira ticket

        When the user asks to file an idea as a ticket (e.g. "file 2 in
        FORGE", "turn #1 into a ticket in IDEAS"), do the following in
        order:

          1. Identify which idea they picked from your previous pitch
             (by number). You already have its title and body in the
             conversation above; reuse them verbatim.
          2. Extract the project key (an uppercase token like FORGE).
          3. If the project key is missing, ask for it in one short line
             and stop.
          4. Otherwise, call the `create-ticket` action with these inputs:
             - `projectKey` = the uppercase project key
             - `summary` = the one-line title (plain text, no `**`)
             - `description` = the full idea body as Markdown (the
               Problem / Who it's for / Forge modules / Happy path
               block from your earlier pitch)
             - `issueType` = `Task`

        Do NOT ask the user to confirm before calling the action. Do NOT
        narrate what you are about to do.

        The action returns `{ ok: true, key: "FORGE-12", url: "..." }`.
        Reply in chat with a short, warm two-line confirmation. Use this
        exact shape (and only this shape, no extra lines, no re-pitch):

          > Nice, your idea is on the board. Check it out here:
          > [FORGE-12](https://your-site.atlassian.net/browse/FORGE-12).
          >
          > Want to refine the scope, split it into smaller tickets, or
          > sketch out a next step? Just ask.

        If the action returns `{ ok: false, error: "..." }`, reply with
        exactly one short line naming the error and stop. Do not retry.
