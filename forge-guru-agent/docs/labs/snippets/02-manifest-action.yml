# Lab 2 snippet — three edits to `manifest.yml`.
#
# ─── EDIT A ─────────────────────────────────────────────────────────────────
# Under `rovo:agent` → the single agent entry, add an `actions:` list that
# references the new `create-ticket` action by key. Place it right after the
# `prompt:` block and before `conversationStarters:`. (Note: plural `actions:`,
# matching how both implementation-plan-agent and sprint-ready-agent declare
# their agents' action lists — `action:` singular will fail `forge lint`.)

      actions:
        - create-ticket

# ─── EDIT B ─────────────────────────────────────────────────────────────────
# Add a new `conversationStarters:` line at the bottom of the existing list.

        - Turn my app idea into a Jira ticket

# ─── EDIT C ─────────────────────────────────────────────────────────────────
# Add a top-level `modules.action` list (sibling of `modules.function` and
# `modules.rovo:agent`). Also add the handler function definition under
# `modules.function`.

  action:
    - key: create-ticket
      name: Create ticket
      description: >
        Create a Jira work item for a Forge app idea the user picked.
        Takes a project key, summary, description, and issue type.
      function: createTicket
      actionVerb: TRIGGER
      inputs:
        projectKey:
          title: Project key
          type: string
          required: true
          description: The Jira project key to create the ticket in, for example FORGE.
        summary:
          title: Summary
          type: string
          required: true
          description: The one-line title of the Jira ticket.
        description:
          title: Description
          type: string
          required: true
          description: The full Jira ticket description as Markdown.
        issueType:
          title: Issue type
          type: string
          required: false
          description: The Jira issue type name. Defaults to Task.

  function:
    # Existing placeholder stays — Forge still requires it even now that
    # we have a real action. Add the handler below alongside it. Use a
    # camelCase function key (not create-ticket-fn) so the module key
    # matches the handler name exactly — same convention used in
    # implementation-plan-agent and sprint-ready-agent, and the shape
    # Rovo's input-binding layer expects.
    - key: placeholder
      handler: index.placeholder
    - key: createTicket
      handler: index.createTicket

# ─── EDIT D ─────────────────────────────────────────────────────────────────
# Add the Jira write scope under `permissions.scopes`.

permissions:
  scopes:
    - write:jira-work
