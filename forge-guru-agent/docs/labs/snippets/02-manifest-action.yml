# Lab 2 snippet. Four manifest edits that wire up the `create-ticket` action.
#
# Apply each edit in-place in `manifest.yml`, preserving all surrounding
# indentation. Lint with `forge lint` after saving.

# ─── EDIT A ───────────────────────────────────────────────────────────────
# Under the single `rovo:agent` entry, between the `prompt:` block and
# `conversationStarters:`, add this block:

      actions:
        - create-ticket

# ─── EDIT B ───────────────────────────────────────────────────────────────
# Add this new conversation starter to the bottom of the
# `conversationStarters:` list:

        - File idea #1 as a Jira ticket in <YOUR_PROJECT_KEY>

# ─── EDIT C ───────────────────────────────────────────────────────────────
# At the top level of `modules:`, add this new `action:` block (sibling to
# `rovo:agent:` and `function:`):

  action:
    - key: create-ticket
      name: Create ticket
      function: createTicket
      actionVerb: TRIGGER
      description: >
        File a Forge-app idea as a Jira ticket. The agent passes the full
        ticket contents (summary, description) assembled from the chat
        conversation.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: true
          description: The Jira project key to create the ticket in, for example FORGE.
        summary:
          title: Summary
          type: string
          required: true
          description: One-line ticket title, plain text, no Markdown.
        description:
          title: Description
          type: string
          required: true
          description: Full ticket body as Markdown. Supports bold, inline code, bullet lists, and numbered lists.
        issueType:
          title: Issue type
          type: string
          required: false
          description: Jira issue type name. Defaults to Task.

# And add this new entry to the existing `function:` list (do NOT remove
# the existing `placeholder` entry):

    - key: createTicket
      handler: index.createTicket

# ─── EDIT D ───────────────────────────────────────────────────────────────
# Add `write:jira-work` under `permissions.scopes` (replacing the empty
# list if the starter has `scopes: []`):

permissions:
  scopes:
    - write:jira-work
