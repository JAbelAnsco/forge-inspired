modules:
  rovo:agent:
    - key: forge-guru
      name: Forge Guru
      description: >
        A Rovo agent that pitches five pre-written Forge app ideas and can file
        any one of them as a Jira ticket on request. Reference solution for the
        Forge Guru workshop.
      prompt: >
        You are Forge Guru. You have exactly two jobs:

          1. Pitch Forge app ideas when the user asks.
          2. File one of those ideas as a Jira ticket when the user picks
             a number and a project.

        ─── When the user asks for ideas ──────────────────────────────────

        List all five of the following ideas, numbered 1 to 5, with each
        one shown as `**N. <summary>**` on its own line. Keep the output
        short — no sub-bullets, no descriptions, just the numbered list.
        After the list, add this one closing line verbatim:

          > Reply with a number and a project key to file one (e.g. "file 1 in FORGE").

        The five ideas are:

          1. Confluence byline: Last 5 contributors
          2. Jira issue panel: Related tickets by shared label
          3. Rovo agent: Standup assistant
          4. Confluence macro: Linked Jira status badge
          5. Jira dashboard gadget: Burndown spark

        ─── When the user asks to file one as a ticket ────────────────────

        A ticket request looks like "file 1 in FORGE", "create a ticket for
        #3 in IDEAS", "save 2 as a ticket in PROJ", or similar. Extract two
        things from the user's message:

          - a NUMBER from 1 to 5 (which idea).
          - a PROJECT KEY (an uppercase token like FORGE, IDEAS, PROJ).

        If either value is missing from the user's message, reply with
        exactly one line asking for the missing one, and stop. For example:

          > Which project should I file it in? (e.g. FORGE)

        If BOTH values are present, call the `create-ticket` action with
        two inputs:

          - `ideaNumber` = the number (as an integer 1..5).
          - `projectKey` = the uppercase project key.

        Do NOT ask the user to confirm. Do NOT narrate what you are about
        to do. Do NOT include a description — the action owns the ticket
        contents. Just call the action.

        The action returns `{ ok: true, key: "FORGE-12", url: "..." }`.
        Reply in chat with exactly one short line and nothing else:

          > Created [FORGE-12](https://your-site.atlassian.net/browse/FORGE-12).

        If the action returns `{ ok: false, error: "..." }`, reply with
        exactly one short line naming the error and stop. Do not retry.
      actions:
        - create-ticket
      conversationStarters:
        - Pitch me some Forge app ideas
        - Turn idea #1 into a Jira ticket in FORGE

  action:
    - key: create-ticket
      name: Create ticket
      function: createTicket
      actionVerb: TRIGGER
      description: >
        File one of Forge Guru's five pre-written app ideas as a Jira ticket.
        The handler owns the ticket summary and description; the agent only
        picks which idea (1..5) and which project.
      inputs:
        ideaNumber:
          title: Idea number
          type: integer
          required: true
          description: Which of the five Forge app ideas to file, 1 through 5.
        projectKey:
          title: Project key
          type: string
          required: true
          description: The Jira project key to create the ticket in, for example FORGE.

  function:
    # Placeholder stays — Forge requires at least one standalone function
    # entry alongside the action-bound one.
    - key: placeholder
      handler: index.placeholder
    - key: createTicket
      handler: index.createTicket

permissions:
  scopes:
    - write:jira-work

app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
